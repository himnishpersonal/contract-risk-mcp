[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-analyzer"
version = "0.1.0"
description = "FastMCP server + LangGraph agent for analyzing financial contract risk from PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
  "httpx",
  "openai",
  "pymupdf",
  "pydantic",
  "langgraph",
  "python-dotenv",
  "tiktoken",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
